<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regola dei Terzi — Gestione Capitale</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080c14;
      --surface:  #0d1420;
      --surface2: #111827;
      --border:   #1e2a3a;
      --border2:  #243040;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --muted2:   #94a3b8;
      --gold:     #f59e0b;
      --gold-dim: rgba(245,158,11,.15);
      --blue:     #3b82f6;
      --blue-dim: rgba(59,130,246,.15);
      --green:    #10b981;
      --green-dim:rgba(16,185,129,.15);
      --red:      #ef4444;
      --yellow:   #eab308;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ═══ TOPBAR ═══ */
    .topbar {
      background: linear-gradient(180deg, #0a0f1a 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 24px 24px;
      text-align: center;
      position: relative;
    }
    .topbar-inner { max-width: 900px; margin: 0 auto; }
    .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), #d97706);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 0 20px rgba(245,158,11,.3);
    }
    .logo-title { font-size: 1.35rem; font-weight: 800; letter-spacing: -.5px; color: #f8fafc; }
    .logo-sub { color: var(--muted); font-size: .8rem; margin-bottom: 20px; }

    .capitale-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .capitale-input-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 14px; padding: 12px 20px;
    }
    .capitale-input-wrap label { color: var(--muted); font-size: .8rem; white-space: nowrap; }
    .capitale-input-wrap .cur { color: var(--muted2); font-size: 1.1rem; font-weight: 600; }
    .capitale-input-wrap input {
      background: none; border: none; outline: none;
      color: #f8fafc; font-size: 1.5rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      width: 180px; text-align: right;
    }

    .badge-stato {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 18px; border-radius: 40px;
      font-size: .85rem; font-weight: 700;
      border: 1px solid;
      transition: all .3s;
    }
    .badge-green { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.35); color: var(--green); }
    .badge-yellow{ background: rgba(234,179, 8,.12); border-color: rgba(234,179, 8,.35); color: var(--yellow);}
    .badge-red   { background: rgba(239, 68,68,.12); border-color: rgba(239, 68,68,.35); color: var(--red);  }

    .score-num { font-size: 1.1rem; font-weight: 800; }
    .btn-reset {
      background: none; border: 1px solid var(--border2); border-radius: 8px;
      color: var(--muted); font-size: .78rem; padding: 8px 14px; cursor: pointer;
      transition: .2s;
    }
    .btn-reset:hover { border-color: var(--red); color: var(--red); }

    /* ═══ GAUGE SECTION ═══ */
    .gauge-section {
      max-width: 900px; margin: 32px auto 0; padding: 0 20px;
      display: flex; justify-content: center; gap: 28px; flex-wrap: wrap;
    }
    .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .gauge-svg { position: relative; width: 110px; height: 110px; }
    .gauge-svg svg { transform: rotate(-220deg); }
    .gauge-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .gauge-center .g-pct { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .gauge-center .g-lbl { font-size: .6rem; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
    .gauge-name { font-size: .78rem; font-weight: 700; color: var(--muted2); text-align: center; }
    .gauge-dev  { font-size: .72rem; font-weight: 700; text-align: center; }

    /* ═══ ALLOC BAR ═══ */
    .alloc-section { max-width: 900px; margin: 28px auto 0; padding: 0 20px; }
    .alloc-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
    .alloc-bar-outer {
      position: relative; height: 12px; border-radius: 12px;
      background: var(--surface2); overflow: visible;
    }
    .alloc-bar-inner { display: flex; height: 100%; border-radius: 12px; overflow: hidden; }
    .alloc-seg { height: 100%; transition: width .5s ease; }
    .alloc-marker {
      position: absolute; top: -6px; width: 2px; height: 24px;
      border-radius: 2px; background: rgba(255,255,255,.2);
    }
    .alloc-marker::after {
      content: attr(data-label);
      position: absolute; top: 28px; left: 50%;
      transform: translateX(-50%);
      font-size: .6rem; color: var(--muted); white-space: nowrap;
    }
    .alloc-legend { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .alloc-legend-item { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted2); }
    .alloc-legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* ═══ PILLARS ═══ */
    .pillars-grid {
      max-width: 900px; margin: 32px auto 0; padding: 0 20px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;
    }
    .pillar-card {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 20px; padding: 22px; position: relative;
      transition: border-color .25s, box-shadow .25s;
    }
    .pillar-card:hover {
      border-color: var(--pc);
      box-shadow: 0 0 32px color-mix(in srgb, var(--pc) 12%, transparent);
    }
    .pillar-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; border-radius: 20px 20px 0 0;
      background: var(--pc);
    }

    .pc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .pc-icon {
      width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
      background: color-mix(in srgb, var(--pc) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--pc) 35%, transparent);
    }
    .pc-title { font-size: 1rem; font-weight: 800; color: #f8fafc; }
    .pc-sub   { font-size: .73rem; color: var(--muted); margin-top: 2px; }

    .pc-amounts { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4px; }
    .pc-total { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; color: #f8fafc; }
    .pc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .pc-pct   { font-size: .95rem; font-weight: 800; color: var(--pc); }
    .pc-dev   { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .dev-green  { background: rgba(16,185,129,.15); color: var(--green); }
    .dev-yellow { background: rgba(234,179, 8,.15); color: var(--yellow);}
    .dev-red    { background: rgba(239, 68,68,.15); color: var(--red);  }

    .pc-progress { height: 6px; border-radius: 6px; background: var(--border2); margin: 10px 0 6px; overflow: hidden; position: relative; }
    .pc-progress-fill { height: 100%; border-radius: 6px; background: var(--pc); transition: width .5s ease; }
    .pc-target-line {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: rgba(255,255,255,.35); left: 33.33%; border-radius: 2px;
    }

    .pc-rebalance {
      font-size: .73rem; color: var(--muted); margin-bottom: 14px;
      display: flex; align-items: center; gap: 5px;
    }
    .pc-rebalance.warn { color: var(--yellow); }
    .pc-rebalance.ok   { color: var(--green); }

    /* voci list */
    .voci-list { display: flex; flex-direction: column; gap: 7px; min-height: 52px; margin-bottom: 14px; }
    .voce-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px; gap: 8px;
    }
    .voce-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .voce-cat-badge {
      font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 20px;
      background: color-mix(in srgb, var(--pc) 15%, transparent);
      color: var(--pc); white-space: nowrap; flex-shrink: 0;
    }
    .voce-name { font-size: .82rem; color: var(--muted2); truncate: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .voce-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .voce-amt  { font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #f8fafc; }
    .voce-vpct { font-size: .68rem; color: var(--muted); }
    .btn-del { background: none; border: none; cursor: pointer; color: #334155; font-size: 1rem; padding: 2px 4px; border-radius: 4px; transition: .15s; line-height: 1; }
    .btn-del:hover { color: var(--red); }
    .empty-voci { text-align: center; color: #2d3f55; font-size: .78rem; padding: 10px 0; }

    /* add form */
    .add-form { display: flex; gap: 6px; flex-wrap: wrap; }
    .add-form select, .add-form input {
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 8px; color: var(--text); font-size: .8rem;
      padding: 8px 10px; outline: none; transition: border-color .2s;
    }
    .add-form select:focus, .add-form input:focus { border-color: var(--pc); }
    .add-form select { flex: 0 0 auto; }
    .add-form .inp-nome { flex: 1; min-width: 80px; }
    .add-form .inp-amt  { width: 95px; flex: none; }
    .add-form input::placeholder { color: #2d3f55; }
    .btn-add {
      background: var(--pc); border: none; border-radius: 8px;
      color: #080c14; font-weight: 800; font-size: 1rem;
      padding: 0 14px; cursor: pointer; transition: opacity .15s; flex-shrink: 0;
    }
    .btn-add:hover { opacity: .82; }

    /* ═══ ANALISI ═══ */
    .analisi-section { max-width: 900px; margin: 32px auto 0; padding: 0 20px; }
    .section-title {
      font-size: .72rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .8px; margin-bottom: 14px;
    }
    .analisi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media(max-width:600px){ .analisi-grid { grid-template-columns: 1fr; } }

    .analisi-table {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 16px; overflow: hidden;
    }
    .analisi-table table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .analisi-table th {
      background: var(--surface2); color: var(--muted); text-transform: uppercase;
      font-size: .65rem; letter-spacing: .5px; padding: 10px 14px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .analisi-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
    .analisi-table tr:last-child td { border-bottom: none; }
    .analisi-table .row-name { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #f8fafc; }
    .analisi-table .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .analisi-table .scost { font-weight: 700; }
    .analisi-table .azione { font-size: .73rem; }

    .ribilancio-card {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 16px; padding: 18px;
    }
    .rib-title { font-size: .82rem; font-weight: 700; color: #f8fafc; margin-bottom: 12px; }
    .rib-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .rib-label { font-size: .78rem; color: var(--muted2); display: flex; align-items: center; gap: 7px; }
    .rib-dot { width: 8px; height: 8px; border-radius: 50%; }
    .rib-val { font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #f8fafc; }
    .rib-sep { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .non-alloc-row { display: flex; justify-content: space-between; align-items: center; }
    .non-alloc-label { font-size: .8rem; color: var(--muted); }
    .non-alloc-val { font-size: 1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .over { color: var(--red); }
    .rib-note { font-size: .7rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .rib-note span { color: var(--green); font-weight: 700; }

    /* ═══ UTILS ═══ */
    @media(max-width:640px){
      .gauge-section { gap: 16px; }
      .pillars-grid { grid-template-columns: 1fr; }
      .capitale-input-wrap input { width: 130px; font-size: 1.2rem; }
      .analisi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

/* ── helpers ── */
const fmt = (n) =>
  new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n || 0);

const fmtPct = (n) => `${n >= 0 ? '+' : ''}${n.toFixed(1)}%`;

const TARGET = 33.333;

const PILLARS = [
  {
    id: 'asset',
    name: 'Asset',
    subtitle: 'Beni rifugio & patrimonio fisico',
    icon: '🏛️',
    color: '#f59e0b',
    cats: ['Oro', 'Argento', 'Immobili', 'Terreni', 'Metalli preziosi', 'Altro'],
    defaultVoci: [
      { id: 1, cat: 'Oro',      nome: 'Lingotti oro', importo: 120000 },
      { id: 2, cat: 'Immobili', nome: 'Appartamento',  importo: 200000 },
    ],
  },
  {
    id: 'liquidita',
    name: 'Liquidità',
    subtitle: 'Cash, titoli di stato & bond',
    icon: '💧',
    color: '#3b82f6',
    cats: ['Euro cash', 'BTP', 'Bond', 'Conto deposito', 'Titoli di Stato', 'Altro'],
    defaultVoci: [
      { id: 3, cat: 'BTP',          nome: 'BTP 2030',        importo: 80000  },
      { id: 4, cat: 'Conto deposito', nome: 'Fondo sicurezza', importo: 70000  },
    ],
  },
  {
    id: 'business',
    name: 'Business & CF',
    subtitle: 'Business operativo & investimenti',
    icon: '⚡',
    color: '#10b981',
    cats: ['Business operativo', 'Investimento speculativo', 'Cash flow', 'Startup', 'Altro'],
    defaultVoci: [
      { id: 5, cat: 'Business operativo',     nome: 'SRL operativa', importo: 100000 },
      { id: 6, cat: 'Investimento speculativo', nome: 'Cripto',       importo: 80000  },
    ],
  },
];

const STORAGE_KEY = 'regola-terzi-v1';

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (_) {}
  return null;
}

function save(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
}

/* ── GaugePillar ── */
function GaugePillar({ pct, color, name, dev }) {
  const R = 42, cx = 55, cy = 55;
  const arc = 260; // degrees of arc
  const rad = (d) => (d * Math.PI) / 180;
  const toPath = (startDeg, sweepDeg, r) => {
    const s = rad(startDeg), e = rad(startDeg + sweepDeg);
    const x1 = cx + r * Math.cos(s), y1 = cy + r * Math.sin(s);
    const x2 = cx + r * Math.cos(e), y2 = cy + r * Math.sin(e);
    const large = sweepDeg > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
  };
  const startDeg = -130;
  const fillDeg = (Math.min(pct, 100) / 100) * arc;
  const targetDeg = (TARGET / 100) * arc;

  const devAbs = Math.abs(pct - TARGET);
  const devClass = devAbs <= 5 ? 'ok' : devAbs <= 10 ? 'warn' : 'bad';
  const devColor = devAbs <= 5 ? 'var(--green)' : devAbs <= 10 ? 'var(--yellow)' : 'var(--red)';

  return (
    <div className="gauge-wrap">
      <div className="gauge-svg">
        <svg width="110" height="110" viewBox="0 0 110 110" style={{ transform: 'rotate(0deg)' }}>
          {/* track */}
          <path d={toPath(startDeg, arc, R)} fill="none" stroke="var(--border2)" strokeWidth="9" strokeLinecap="round" />
          {/* fill */}
          {fillDeg > 0 && (
            <path d={toPath(startDeg, fillDeg, R)} fill="none" stroke={color} strokeWidth="9" strokeLinecap="round"
              style={{ transition: 'all .5s ease', filter: `drop-shadow(0 0 6px ${color}60)` }} />
          )}
          {/* target marker */}
          {(() => {
            const a = rad(startDeg + targetDeg);
            const ox = cx + R * Math.cos(a), oy = cy + R * Math.sin(a);
            const ix = cx + (R - 6) * Math.cos(a), iy = cy + (R - 6) * Math.sin(a);
            return <line x1={ox} y1={oy} x2={ix} y2={iy} stroke="rgba(255,255,255,.5)" strokeWidth="2" strokeLinecap="round" />;
          })()}
        </svg>
        <div className="gauge-center">
          <span className="g-pct" style={{ color }}>{pct.toFixed(1)}%</span>
          <span className="g-lbl">del totale</span>
        </div>
      </div>
      <div className="gauge-name" style={{ color }}>{name}</div>
      <div className="gauge-dev" style={{ color: devColor }}>
        {dev >= 0 ? '+' : ''}{dev.toFixed(1)}% vs 33%
      </div>
    </div>
  );
}

/* ── AllocBar ── */
function AllocBar({ segs, totale }) {
  return (
    <div className="alloc-section">
      <div className="alloc-label">Allocazione capitale</div>
      <div className="alloc-bar-outer">
        <div className="alloc-bar-inner">
          {segs.map((s) => (
            <div key={s.id} className="alloc-seg" style={{ width: `${s.pct}%`, background: s.color }} />
          ))}
        </div>
        <div className="alloc-marker" style={{ left: '33.33%' }} data-label="33%" />
        <div className="alloc-marker" style={{ left: '66.66%' }} data-label="66%" />
      </div>
      <div className="alloc-legend">
        {segs.map((s) => (
          <div key={s.id} className="alloc-legend-item">
            <div className="alloc-legend-dot" style={{ background: s.color }} />
            {s.name}: {s.pct.toFixed(1)}%
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── PillarCard ── */
function PillarCard({ config, voci, capitaleTotal, onAdd, onRemove }) {
  const [cat, setCat]       = useState(config.cats[0]);
  const [nome, setNome]     = useState('');
  const [importo, setImp]   = useState('');

  const totale = voci.reduce((s, v) => s + v.importo, 0);
  const pct    = capitaleTotal > 0 ? (totale / capitaleTotal) * 100 : 0;
  const dev    = pct - TARGET;
  const devAbs = Math.abs(dev);
  const devClass = devAbs <= 5 ? 'dev-green' : devAbs <= 10 ? 'dev-yellow' : 'dev-red';
  const needed   = capitaleTotal * (TARGET / 100) - totale;

  const handleAdd = () => {
    const imp = parseFloat(String(importo).replace(',', '.'));
    if (!nome.trim() || isNaN(imp) || imp <= 0) return;
    onAdd({ id: Date.now(), cat, nome: nome.trim(), importo: imp });
    setNome(''); setImp('');
  };

  const rebalMsg = () => {
    if (devAbs <= 1) return { cls: 'ok', msg: '✓ In equilibrio con il target 33%' };
    if (needed > 0)  return { cls: 'warn', msg: `Aggiungi ${fmt(needed)} per raggiungere il 33%` };
    return { cls: 'warn', msg: `Eccede di ${fmt(-needed)} rispetto al target 33%` };
  };
  const { cls: rebCls, msg: rebMsg } = rebalMsg();

  const style = { '--pc': config.color };

  return (
    <div className="pillar-card" style={style}>
      <div className="pc-header">
        <div className="pc-icon">{config.icon}</div>
        <div>
          <div className="pc-title">{config.name}</div>
          <div className="pc-sub">{config.subtitle}</div>
        </div>
      </div>

      <div className="pc-amounts">
        <div className="pc-total">{fmt(totale)}</div>
        <div className="pc-right">
          <div className="pc-pct">{pct.toFixed(1)}%</div>
          <div className={`pc-dev ${devClass}`}>{fmtPct(dev)} vs 33%</div>
        </div>
      </div>

      <div className="pc-progress">
        <div className="pc-target-line" />
        <div className="pc-progress-fill" style={{ width: `${Math.min(pct * 3, 100)}%` }} />
      </div>

      <div className={`pc-rebalance ${rebCls}`}>{rebMsg}</div>

      <div className="voci-list">
        {voci.length === 0 && <div className="empty-voci">Nessuna voce — usa il form qui sotto</div>}
        {voci.map((v) => {
          const vp = totale > 0 ? ((v.importo / totale) * 100).toFixed(0) : 0;
          return (
            <div className="voce-item" key={v.id}>
              <div className="voce-left">
                <span className="voce-cat-badge">{v.cat}</span>
                <span className="voce-name" title={v.nome}>{v.nome}</span>
              </div>
              <div className="voce-right">
                <span className="voce-amt">{fmt(v.importo)}</span>
                <span className="voce-vpct">{vp}%</span>
                <button className="btn-del" onClick={() => onRemove(v.id)} title="Rimuovi">×</button>
              </div>
            </div>
          );
        })}
      </div>

      <div className="add-form">
        <select value={cat} onChange={(e) => setCat(e.target.value)}>
          {config.cats.map((c) => <option key={c}>{c}</option>)}
        </select>
        <input className="inp-nome" placeholder="Nome voce" value={nome}
          onChange={(e) => setNome(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && handleAdd()} />
        <input className="inp-amt" placeholder="€" type="number" min="0" value={importo}
          onChange={(e) => setImp(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && handleAdd()} />
        <button className="btn-add" onClick={handleAdd} title="Aggiungi">+</button>
      </div>
    </div>
  );
}

/* ── AnalisiPanel ── */
function AnalisiPanel({ totals, capitale }) {
  const totalAllocato = totals.reduce((s, t) => s + t.totale, 0);
  const nonAlloc      = capitale - totalAllocato;
  const perPilastro   = capitale / 3;

  return (
    <div className="analisi-section">
      <div className="section-title">Analisi & Ribilanciamento</div>
      <div className="analisi-grid">
        {/* tabella */}
        <div className="analisi-table">
          <table>
            <thead>
              <tr>
                <th>Pilastro</th>
                <th>Totale</th>
                <th>Attuale</th>
                <th>Scostamento</th>
                <th>Azione</th>
              </tr>
            </thead>
            <tbody>
              {totals.map((t) => {
                const dev    = t.pct - TARGET;
                const devAbs = Math.abs(dev);
                const col    = devAbs <= 5 ? 'var(--green)' : devAbs <= 10 ? 'var(--yellow)' : 'var(--red)';
                const needed = perPilastro - t.totale;
                const azione = devAbs <= 1 ? '✓ Bilanciato' : needed > 0 ? `Aggiungi ${fmt(needed)}` : `Riduci ${fmt(-needed)}`;
                return (
                  <tr key={t.id}>
                    <td><div className="row-name"><div className="dot" style={{ background: t.color }} />{t.name}</div></td>
                    <td>{fmt(t.totale)}</td>
                    <td>{t.pct.toFixed(1)}%</td>
                    <td><span className="scost" style={{ color: col }}>{fmtPct(dev)}</span></td>
                    <td><span className="azione" style={{ color: col }}>{azione}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* ribilanciamento */}
        <div className="ribilancio-card">
          <div className="rib-title">📊 Piano di ribilanciamento</div>
          {totals.map((t) => {
            const needed = perPilastro - t.totale;
            return (
              <div className="rib-row" key={t.id}>
                <div className="rib-label">
                  <div className="rib-dot" style={{ background: t.color }} />
                  {t.name}
                </div>
                <div className="rib-val" style={{ color: needed >= 0 ? t.color : 'var(--red)' }}>
                  {needed >= 0 ? `+ ${fmt(needed)}` : `− ${fmt(-needed)}`}
                </div>
              </div>
            );
          })}
          <hr className="rib-sep" />
          <div className="non-alloc-row">
            <span className="non-alloc-label">Capitale non allocato</span>
            <span className={`non-alloc-val ${nonAlloc < 0 ? 'over' : ''}`}>
              {nonAlloc < 0 ? `⚠ ${fmt(nonAlloc)}` : fmt(nonAlloc)}
            </span>
          </div>
          {nonAlloc > 0 && perPilastro > 0 && (
            <div className="rib-note">
              Con {fmt(nonAlloc)} disponibili: distribuisci{' '}
              <span>{fmt(nonAlloc / 3)}</span> su ciascun pilastro per mantenere l'equilibrio.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   APP
═══════════════════════════════════════ */
function App() {
  const saved = load();

  const [capitaleStr, setCapitaleStr] = useState(saved?.capitaleStr ?? '650000');
  const [voci, setVoci] = useState(saved?.voci ?? (() => {
    const v = {};
    PILLARS.forEach((p) => { v[p.id] = p.defaultVoci; });
    return v;
  })());

  /* persist */
  useEffect(() => { save({ capitaleStr, voci }); }, [capitaleStr, voci]);

  const capitale = useMemo(() => {
    const n = parseFloat(String(capitaleStr).replace(/\./g, '').replace(',', '.'));
    return isNaN(n) || n < 0 ? 0 : n;
  }, [capitaleStr]);

  const totals = useMemo(() =>
    PILLARS.map((p) => {
      const totale = voci[p.id].reduce((s, v) => s + v.importo, 0);
      const pct    = capitale > 0 ? (totale / capitale) * 100 : 0;
      return { ...p, totale, pct };
    }), [voci, capitale]);

  const score = useMemo(() => {
    if (capitale === 0) return 100;
    const maxDev = totals.reduce((mx, t) => Math.max(mx, Math.abs(t.pct - TARGET)), 0);
    return Math.max(0, Math.round(100 - maxDev * 4));
  }, [totals, capitale]);

  const badgeProps = score >= 85
    ? { cls: 'badge-green', label: 'Bilanciato',      icon: '🟢' }
    : score >= 60
    ? { cls: 'badge-yellow', label: 'Da ribilanciare', icon: '🟡' }
    : { cls: 'badge-red',   label: 'Sbilanciato',     icon: '🔴' };

  const segs = totals.map((t) => ({ id: t.id, name: t.name, color: t.color, pct: t.pct }));

  const addVoce    = (pid, v) => setVoci((p) => ({ ...p, [pid]: [...p[pid], v] }));
  const removeVoce = (pid, id) => setVoci((p) => ({ ...p, [pid]: p[pid].filter((v) => v.id !== id) }));
  const reset = () => {
    if (!confirm('Resettare tutti i dati?')) return;
    const def = {};
    PILLARS.forEach((p) => { def[p.id] = p.defaultVoci; });
    setVoci(def);
    setCapitaleStr('650000');
    localStorage.removeItem(STORAGE_KEY);
  };

  return (
    <div>
      {/* ── TOPBAR ── */}
      <div className="topbar">
        <div className="topbar-inner">
          <div className="logo-row">
            <div className="logo-icon">⅓</div>
            <h1 className="logo-title">Regola dei Terzi</h1>
          </div>
          <p className="logo-sub">33% Asset · 33% Liquidità · 33% Business & Cash Flow</p>
          <div className="capitale-row">
            <div className="capitale-input-wrap">
              <label>Capitale totale</label>
              <span className="cur">€</span>
              <input
                type="number" min="0" value={capitaleStr}
                onChange={(e) => setCapitaleStr(e.target.value)}
                title="Modifica il capitale totale"
              />
            </div>
            <div className={`badge-stato ${badgeProps.cls}`}>
              {badgeProps.icon} {badgeProps.label}
              <span className="score-num">&nbsp;{score}/100</span>
            </div>
            <button className="btn-reset" onClick={reset}>↺ Reset</button>
          </div>
        </div>
      </div>

      {/* ── GAUGE ── */}
      <div className="gauge-section">
        {totals.map((t) => (
          <GaugePillar key={t.id} pct={t.pct} color={t.color} name={t.name} dev={t.pct - TARGET} />
        ))}
      </div>

      {/* ── ALLOC BAR ── */}
      <AllocBar segs={segs} totale={capitale} />

      {/* ── PILLARS ── */}
      <div className="pillars-grid">
        {PILLARS.map((p) => (
          <PillarCard
            key={p.id}
            config={p}
            voci={voci[p.id]}
            capitaleTotal={capitale}
            onAdd={(v) => addVoce(p.id, v)}
            onRemove={(id) => removeVoce(p.id, id)}
          />
        ))}
      </div>

      {/* ── ANALISI ── */}
      <AnalisiPanel totals={totals} capitale={capitale} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
